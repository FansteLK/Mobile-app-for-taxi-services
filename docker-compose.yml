# docker compose up --build        API on http://localhost:4000, seeded with demo data
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  seed:
    build: ./backend
    command: ["node", "dist/seed.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/taxiprojekat
    depends_on: { mongo: { condition: service_healthy } }

  api:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/taxiprojekat
      # FUNCTIONS_BASE_URL: https://<region>-<project>.cloudfunctions.net   (push notifications)
    depends_on: { seed: { condition: service_completed_successfully } }

volumes:
  mongo-data:
